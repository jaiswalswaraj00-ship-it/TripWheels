<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TripWheels | OTP Verification</title>

    <style>

        /* =====================================================
           TRIPWHEELS — OTP VERIFICATION
           Same Theme as Index + Login
           ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;

            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(44, 52, 128, 0.12),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 85% 80%,
                    rgba(233, 30, 99, 0.10),
                    transparent 35%
                ),
                #F7F8FC;
        }

        /* =====================================================
           OTP CARD
           ===================================================== */

        .otp-card {
            position: relative;

            width: 420px;

            padding: 42px 38px;

            background: #FFFFFF;

            border: 2px solid #E91E63;

            border-radius: 22px;

            text-align: center;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.25),
    0 0 22px rgba(233, 30, 99, 0.18);

            overflow: hidden;
        }

        /* Colored top line */

        .otp-card::before {
            content: "";

            position: absolute;

            top: 0;
            left: 15%;

            width: 70%;
            height: 3px;

            border-radius: 0 0 10px 10px;

            background:
                linear-gradient(
                    90deg,
                    #080A12,
                    #2C3480,
                    #E91E63
                );
        }

        /* =====================================================
           LOGO
           ===================================================== */

        .logo {
            width: 64px;
            height: 64px;

            margin: 0 auto 20px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 16px;

            background:
                linear-gradient(
                    135deg,
                    #080A12,
                    #2C3480 55%,
                    #E91E63
                );

            color: white;

            font-size: 22px;
            font-weight: 800;

            box-shadow:
                0 8px 20px rgba(44, 52, 128, 0.25),
                0 8px 20px rgba(233, 30, 99, 0.15);
        }

        /* =====================================================
           HEADING
           ===================================================== */

        h1 {
            margin-top: 8px;
            margin-bottom: 10px;

            color: #111111;

            font-size: 28px;
            font-weight: 700;
        }

        /* =====================================================
           DESCRIPTION
           ===================================================== */

        .description {
            color: #667085;

            font-size: 14px;

            line-height: 1.6;

            margin-bottom: 7px;
        }

        /* =====================================================
           PHONE NUMBER
           ===================================================== */

        .phone {
            margin-top: 7px;

            color: #2C3480;

            font-size: 15px;

            font-weight: 700;
        }

        /* =====================================================
           OTP INPUT
           ===================================================== */

        .otp-input {
            width: 100%;
            height: 56px;

            margin-top: 28px;

            padding: 0 15px;

            background: #FFFFFF;

            border: 2px solid #D5D8E2;

            border-radius: 12px;

            outline: none;

            text-align: center;

            letter-spacing: 8px;

            color: #111111;

            font-size: 24px;

            font-weight: 700;

            transition: all 0.25s ease;
        }

        .otp-input::placeholder {
            color: #B5BAC6;

            letter-spacing: 7px;
        }

        .otp-input:hover {
            border-color: #2C3480;
        }

        .otp-input:focus {
            border-color: #E91E63;

            box-shadow:
                0 0 0 4px rgba(233, 30, 99, 0.10),
                0 5px 18px rgba(44, 52, 128, 0.08);
        }

        /* =====================================================
           VERIFY BUTTON
           ===================================================== */

        .verify-btn {
            width: 100%;
            height: 52px;

            margin-top: 18px;

            border: none;

            border-radius: 11px;

            background:
                linear-gradient(
                    135deg,
                    #080A12 0%,
                    #2C3480 48%,
                    #E91E63 100%
                );

            color: white;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 8px 20px rgba(44, 52, 128, 0.28),
                0 10px 28px rgba(233, 30, 99, 0.20);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;
        }

        .verify-btn:hover {
            background:
                linear-gradient(
                    135deg,
                    #111525 0%,
                    #2C3480 45%,
                    #E91E63 100%
                );

            box-shadow:
                0 12px 25px rgba(44, 52, 128, 0.32),
                0 15px 35px rgba(233, 30, 99, 0.28);

            transform: translateY(-3px);
        }

        .verify-btn:active {
            transform: translateY(0);
        }

        /* =====================================================
           MESSAGE
           ===================================================== */

        #message {
            margin-top: 17px;

            min-height: 18px;

            font-size: 13px;

            font-weight: 700;
        }

        /* =====================================================
           BACK BUTTON
           ===================================================== */

        .back {
            display: inline-block;

            margin-top: 21px;

            color: #E91E63;

            text-decoration: none;

            font-size: 13px;

            font-weight: 700;

            transition: color 0.2s ease;
        }

        .back:hover {
            color: #2C3480;

            text-decoration: underline;
        }

        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 500px) {

            body {
                padding: 15px;
            }

            .otp-card {
                width: 100%;

                padding: 35px 22px;

                border-radius: 19px;
            }

            h1 {
                font-size: 24px;
            }

            .otp-input {
                height: 53px;

                font-size: 22px;

                letter-spacing: 6px;
            }
        }

    </style>

</head>


<body>

    <div class="otp-card">

        <!-- LOGO -->
        <div class="logo">
            TW
        </div>


        <!-- HEADING -->
        <h1>
            Verify your phone
        </h1>


        <!-- DESCRIPTION -->
        <p class="description">
            Enter the 6-digit OTP sent to
        </p>


        <!-- PHONE -->
        <div class="phone" id="phoneNumber">
            +91 XXXXX XXXXX
        </div>


        <!-- OTP -->
        <input
            type="text"
            id="otpInput"
            class="otp-input"
            maxlength="6"
            inputmode="numeric"
            autocomplete="one-time-code"
            placeholder="000000"
        >


        <!-- VERIFY -->
        <button
            type="button"
            class="verify-btn"
            onclick="verifyOTP()"
        >
            Verify & Continue
        </button>


        <!-- MESSAGE -->
        <div id="message"></div>


        <!-- BACK -->
        <a
            href="login.html"
            class="back"
        >
            ← Back to Login
        </a>

    </div>


    <script>

        /* =====================================================
           GET LOGIN DATA
           ===================================================== */

        const phone =
            localStorage.getItem("tripwheelsPhone");

        const savedOTP =
            localStorage.getItem("tripwheelsOTP");


        /* =====================================================
           SHOW PHONE NUMBER
           ===================================================== */

        if (phone) {

            document.getElementById("phoneNumber").innerText =
                "+91 " + phone;

        }


        /* =====================================================
           ALLOW ONLY NUMBERS
           ===================================================== */

        document
            .getElementById("otpInput")
            .addEventListener("input", function () {

                this.value =
                    this.value.replace(/\D/g, "");

            });


        /* =====================================================
           VERIFY OTP
           ===================================================== */

        function verifyOTP() {

            const enteredOTP =
                document
                    .getElementById("otpInput")
                    .value
                    .trim();

            const message =
                document.getElementById("message");


            /* Empty OTP */

            if (enteredOTP === "") {

                message.innerText =
                    "Please enter the OTP.";

                message.style.color =
                    "#E91E63";

                return;
            }


            /* OTP must contain 6 digits */

            if (enteredOTP.length !== 6) {

                message.innerText =
                    "Please enter a valid 6-digit OTP.";

                message.style.color =
                    "#E91E63";

                return;
            }


            /* Correct OTP */

            if (enteredOTP === savedOTP) {

                message.innerText =
                    "OTP verified successfully.";

                message.style.color =
                    "#2C3480";


                /* Remove OTP after verification */

                localStorage.removeItem(
                    "tripwheelsOTP"
                );


                /* Get phone number from Login */

                const phoneNumber =
                    localStorage.getItem(
                        "tripwheelsLogin"
                    );


                /* Save verified phone */

                sessionStorage.setItem(
                    "tripwheelsPhone",
                    phoneNumber
                );


                /* Get selected role */

                const role =
                    localStorage.getItem(
                        "tripwheelsRole"
                    );


                /* Save role */

                sessionStorage.setItem(
                    "tripwheelsRole",
                    role
                );


                /* Move to next page */

                setTimeout(() => {

                    if (role === "owner") {

                        /* Owner → Owner Dashboard */

                        window.location.href =
                            "owner-dashboard.html";

                    } else {

                        /* User → Profile */

                        window.location.href =
                            "profile.html";

                    }

                }, 800);


            } else {

                /* Incorrect OTP */

                message.innerText =
                    "Incorrect OTP. Please try again.";

                message.style.color =
                    "#E91E63";

            }

        }

    </script>

</body>

</html><h1></h1>
